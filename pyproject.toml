[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evka-position-tools"
version = "0.2.1"
description = "Python tools for the evka_position spherical 3D positioning system"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
]

[project.scripts]
evka-gui = "tools.evka_gui.__main__:main"
evka-calibration = "tools.calibration.gui:main"
position-checker = "tools.position_checker.main:main"

[tool.setuptools.packages.find]
include = ["tools*"]
