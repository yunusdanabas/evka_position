[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evka-position-tools"
version = "0.2.1"
description = "Python tools for the evka_position spherical 3D positioning system"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    # Capped below 2.0 for the Wine/PyInstaller Windows build — see requirements.txt.
    "numpy>=1.24,<2",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
]

[project.scripts]
evka-gui = "tools.evka_gui.__main__:main"
evka-calibration = "tools.calibration.gui:main"
position-checker = "tools.position_checker.main:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
markers = [
    "qt_heavy: builds pyqtgraph/Qt widgets; must run in its own `pytest -m qt_heavy --forked` invocation",
]
