[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evka-position-tools"
version = "0.1.0"
description = "Python tools for the evka_position spherical 3D positioning system"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.7",
    "numpy>=1.20",
    "PyQt5>=5.15",
    "pyqtgraph>=0.12",
]

[project.scripts]
evka-gui = "tools.evka_gui.__main__:main"
position-checker = "tools.position_checker.main:main"

[tool.setuptools.packages.find]
include = ["tools*"]
