name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/webdash_harness/package-lock.json

      - name: Install Python and PlatformIO dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest platformio

      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Run embedded dashboard harness
        working-directory: tools/webdash_harness
        run: |
          npm ci
          npm test

      - name: Build main firmware (classic ESP32)
        run: pio run -e wemos_d1_r32

      - name: Build main firmware (v4 PCB, ESP32-S3)
        run: pio run -e esp32s3_v4

      - name: Build main firmware (v4 PCB, RGB GPIO38)
        run: pio run -e esp32s3_v4_rgb38

      - name: Build remote pendant firmware
        run: pio run -e button_remote

      - name: Build remote pendant test firmware
        run: pio run -e button_remote_test

      - name: Build classic standalone test firmware
        run: >-
          pio run
          -e test_drawwire
          -e test_rotary
          -e test_single_rotary
          -e test_all_sensors
          -e test_calibration
