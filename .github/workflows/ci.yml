name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python and PlatformIO dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy PyQt5 pyqtgraph platformio

      - name: Run Python tests
        run: pytest -q

      - name: Build main firmware
        run: pio run -e wemos_d1_r32
