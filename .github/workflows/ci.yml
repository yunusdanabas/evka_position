name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python and PlatformIO dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy PyQt5 pyqtgraph platformio

      - name: Run Python tests
        run: pytest -q

      - name: Build main firmware (classic ESP32)
        run: pio run -e wemos_d1_r32

      - name: Build main firmware (v4 PCB, ESP32-S3)
        run: pio run -e esp32s3_v4

      - name: Build remote pendant firmware
        run: pio run -e button_remote

      - name: Build CMD C# app
        run: dotnet build "firmware/src/CMD Soft/CMDScanner.csproj" -c Release
