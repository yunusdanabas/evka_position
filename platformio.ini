[platformio]
src_dir = firmware

[env:wemos_d1_r32]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
lib_deps =
    madhephaestus/ESP32Encoder@^0.11
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/AsyncTCP@1.1.1
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<src/>

; V4 PCB — ESP32-S3-DevKitC-1 (N16R8V). Same firmware, pin map selected by -DPCB_V4.
[env:esp32s3_v4]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DPCB_V4
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    madhephaestus/ESP32Encoder@^0.11
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/AsyncTCP@1.1.1
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
build_src_filter = +<src/>

; Same as esp32s3_v4 but RGB LED on GPIO38 (ESP32-S3-DevKitC-1 v1.1).
[env:esp32s3_v4_rgb38]
extends = env:esp32s3_v4
build_flags =
    -DPCB_V4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRGB_LED_GPIO=38

[env:test_drawwire]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
lib_deps = PaulStoffregen/Encoder@1.4.4
monitor_speed = 115200
build_src_filter = +<tests/DrawWireTest/>

[env:test_rotary]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
lib_deps = PaulStoffregen/Encoder@1.4.4
monitor_speed = 115200
build_src_filter = +<tests/RotaryEncoderTest/>

[env:test_single_rotary]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
lib_deps = PaulStoffregen/Encoder@1.4.4
monitor_speed = 115200
build_src_filter = +<tests/SingleRotaryTest/>

[env:test_all_sensors]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
lib_deps = PaulStoffregen/Encoder@1.4.4
monitor_speed = 115200
build_src_filter = +<tests/AllSensorsTest/>

[env:test_calibration]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
lib_deps = PaulStoffregen/Encoder@1.4.4
monitor_speed = 115200
build_src_filter = +<tests/CalibrationTest/>

[env:button_remote]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<remote/>
; ESP32-C3 USB-Serial/JTAG rejects RTS/DTR — suppress them or monitor disconnects immediately
monitor_rts = 0
monitor_dtr = 0

[env:button_remote_test]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<tests/ButtonRemoteTest/>
; ESP32-C3 USB-Serial/JTAG rejects RTS/DTR — suppress them or monitor disconnects immediately
monitor_rts = 0
monitor_dtr = 0
